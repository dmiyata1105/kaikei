<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>まむバースデー お会計電卓</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff4fa;color:#302430;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}main{max-width:650px;margin:auto;padding:20px 15px 40px}header{background:linear-gradient(135deg,#f7c6e2,#e9d7ff);border:1px solid #edc5e0;border-radius:20px;padding:20px;margin-bottom:14px}h1{font-size:1.45rem;margin:0 0 6px}header p{margin:0;color:#644b61;font-size:.9rem}section{background:white;border:1px solid #f0dce9;border-radius:16px;padding:15px;margin:12px 0}h2{font-size:1.03rem;margin:0 0 10px}.rule{font-size:.82rem;color:#756675;line-height:1.55;margin:8px 0 0}label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #f4eaf1}label:last-child{border-bottom:0}input,select,button{font:inherit}input[type=number],input[type=text],select{width:125px;max-width:48%;padding:10px;border:1px solid #dfcbd9;border-radius:10px;background:white;color:#302430}input[type=number]{text-align:right}.line-item{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:8px;margin:10px 0;align-items:stretch}.line-item input{width:100%;max-width:100%;min-width:0;min-height:46px;padding:10px;border:1px solid #dfcbd9;border-radius:10px;font-size:16px;touch-action:manipulation}.add{border:1px solid #d7a9c7;background:#fff8fc;color:#704362;padding:12px 14px;min-height:46px;border-radius:10px;touch-action:manipulation}.remove{border:0;border-radius:9px;background:#f7e6ef;color:#804b68;font-size:1.3rem;min-height:46px;min-width:44px;touch-action:manipulation}@media(max-width:420px){.line-item{grid-template-columns:minmax(0,1fr) 78px 44px;gap:6px}.line-item input{padding:9px 7px;font-size:16px}}.total{background:#382638;color:white;border-radius:18px;padding:17px;margin-top:14px}.total .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0}.grand{border-top:1px solid #796578;margin-top:8px;padding-top:14px!important;font-size:1.5rem;font-weight:750}.small{font-size:.8rem;color:#e4d5e2;margin-top:7px}.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1;border:0;border-radius:11px;padding:12px;background:#a64f85;color:white;font-weight:700}.actions .secondary{background:#eadfe9;color:#443446}.status{font-size:.84rem;color:#715b70;white-space:pre-wrap}
</style></head><body><main>
<header><h1>🎂 まむバースデー電卓</h1><p>バースデー期間専用のお会計計算</p></header>
<section><h2>① 飲み放題</h2><label><span>利用時間</span><select id="hours"><option value="1">1時間</option><option value="2">2時間</option><option value="3">3時間</option><option value="4">4時間</option><option value="5">5時間</option><option value="6">6時間</option><option value="7">7時間</option><option value="8">8時間</option><option value="9">9時間</option><option value="10">10時間</option><option value="11">11時間</option><option value="12">12時間</option></select></label><p class="rule">1時間2,000円、3時間で6,000円。4時間目以降は追加なし。</p></section>
<section><h2>② バースデー・キャスドリ（杯数）</h2>
<label><span>まむD（1杯 ¥1,000）</span><input type="number" class="cast-count" data-price="1000" min="0" step="1" value="0" aria-label="まむDの杯数"></label>
<label><span>山田D（1杯 ¥1,000）</span><input type="number" class="cast-count" data-price="1000" min="0" step="1" value="0" aria-label="山田Dの杯数"></label>
<label><span>宮田D（1杯 ¥1,000）</span><input type="number" class="cast-count" data-price="1000" min="0" step="1" value="0" aria-label="宮田Dの杯数"></label>
<label><span>まむS（1杯 ¥3,000）</span><input type="number" class="cast-count" data-price="3000" min="0" step="1" value="0" aria-label="まむSの杯数"></label>
<label><span>山田S（1杯 ¥2,000）</span><input type="number" class="cast-count" data-price="2000" min="0" step="1" value="0" aria-label="山田Sの杯数"></label>
<label><span>宮田S（1杯 ¥2,000）</span><input type="number" class="cast-count" data-price="2000" min="0" step="1" value="0" aria-label="宮田Sの杯数"></label>
<label><span>お客様S（1杯 ¥500）</span><input type="number" class="cast-count" data-price="500" min="0" step="1" value="0" aria-label="お客様Sの杯数"></label>
<p class="rule">杯数を入力するとキャスドリ料金が自動計算されます。</p></section>
<section><h2>③ まむオリシャン</h2><label><span>まむオリシャン（1本 ¥25,000）</span><input type="number" id="originalCount" min="0" step="1" value="0" aria-label="まむオリシャン本数"></label></section>
<section><h2>④ その他（シャンパン・追加料金など）</h2><div id="items"><div class="line-item"><input type="text" placeholder="項目名" aria-label="その他の項目名 1"><input type="number" min="0" step="1" placeholder="金額" aria-label="その他の金額 1"><button type="button" class="remove" data-remove-row aria-label="項目を削除">×</button></div><div class="line-item"><input type="text" placeholder="項目名" aria-label="その他の項目名 2"><input type="number" min="0" step="1" placeholder="金額" aria-label="その他の金額 2"><button type="button" class="remove" data-remove-row aria-label="項目を削除">×</button></div><div class="line-item"><input type="text" placeholder="項目名" aria-label="その他の項目名 3"><input type="number" min="0" step="1" placeholder="金額" aria-label="その他の金額 3"><button type="button" class="remove" data-remove-row aria-label="項目を削除">×</button></div><div class="line-item"><input type="text" placeholder="項目名" aria-label="その他の項目名 4"><input type="number" min="0" step="1" placeholder="金額" aria-label="その他の金額 4"><button type="button" class="remove" data-remove-row aria-label="項目を削除">×</button></div><div class="line-item"><input type="text" placeholder="項目名" aria-label="その他の項目名 5"><input type="number" min="0" step="1" placeholder="金額" aria-label="その他の金額 5"><button type="button" class="remove" data-remove-row aria-label="項目を削除">×</button></div><div class="line-item"><input type="text" placeholder="項目名" aria-label="その他の項目名 6"><input type="number" min="0" step="1" placeholder="金額" aria-label="その他の金額 6"><button type="button" class="remove" data-remove-row aria-label="項目を削除">×</button></div><div class="line-item"><input type="text" placeholder="項目名" aria-label="その他の項目名 7"><input type="number" min="0" step="1" placeholder="金額" aria-label="その他の金額 7"><button type="button" class="remove" data-remove-row aria-label="項目を削除">×</button></div><div class="line-item"><input type="text" placeholder="項目名" aria-label="その他の項目名 8"><input type="number" min="0" step="1" placeholder="金額" aria-label="その他の金額 8"><button type="button" class="remove" data-remove-row aria-label="項目を削除">×</button></div></div><button type="button" class="add" id="addItem">＋ 項目を追加</button><p class="rule">最初から8項目入力できます。足りないときは「＋ 項目を追加」で増やせます。</p></section>
<section><h2>⑤ お支払い方法</h2><label><span>支払い方法</span><select id="payment"><option value="cash">現金（追加なし）</option><option value="card">カード（さらに1.1倍）</option><option value="paypay">PayPay（さらに1.1倍）</option></select></label></section>
<div class="total" aria-live="polite"><div class="row"><span>飲み放題</span><strong id="drinkTotal">¥0</strong></div><div class="row"><span>キャスドリ</span><strong id="castTotal">¥0</strong></div><div class="row"><span>まむオリシャン</span><strong id="originalTotal">¥0</strong></div><div class="row"><span>その他</span><strong id="otherTotal">¥0</strong></div><div class="row"><span>小計</span><strong id="subtotal">¥0</strong></div><div class="row"><span>TAX（10%）</span><strong id="tax">¥0</strong></div><div class="row"><span>カード・PayPay追加分</span><strong id="paymentFee">¥0</strong></div><div class="row grand"><span>お支払い合計</span><strong id="grandTotal">¥0</strong></div><div class="small">円未満が出た場合は1円単位で四捨五入します。</div></div>
<div class="actions"><button id="copy" type="button">明細をコピー</button><button id="reset" type="button" class="secondary">リセット</button></div><p class="status" id="status"></p>
</main><script>
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');const hours=document.getElementById('hours'),items=document.getElementById('items'),status=document.getElementById('status');
function addItem(name='',amount=''){const row=document.createElement('div');row.className='line-item';const n=document.createElement('input');n.type='text';n.placeholder='例：追加シャンパン';n.value=name;n.setAttribute('aria-label','項目名');const a=document.createElement('input');a.type='number';a.min='0';a.step='1';a.placeholder='金額';a.value=amount;a.setAttribute('aria-label','金額');const x=document.createElement('button');x.type='button';x.className='remove';x.textContent='×';x.setAttribute('aria-label','項目を削除');n.addEventListener('input',calculate);a.addEventListener('input',calculate);x.addEventListener('click',()=>{row.remove();calculate()});row.append(n,a,x);items.append(row);calculate()}
function calculate(){const h=Number(hours.value),drink=Math.min(h,3)*2000;const cast=[...document.querySelectorAll('.cast-count')].reduce((s,e)=>s+Math.max(0,Math.floor(Number(e.value)||0))*Number(e.dataset.price),0);const original=Math.max(0,Math.floor(Number(document.getElementById('originalCount').value)||0))*25000;
const other=[...items.querySelectorAll('.line-item')].reduce((s,r)=>s+Math.max(0,Number(r.children[1].value)||0),0);const subtotal=drink+cast+original+other;const tax=Math.round(subtotal*.1);const taxed=subtotal+tax;const payment=document.getElementById('payment').value;const total=(taxed<=10000&&(payment==='card'||payment==='paypay'))?Math.round(taxed*1.1):taxed;const paymentFee=total-taxed;for(const [id,v] of Object.entries({drinkTotal:drink,castTotal:cast,originalTotal:original,otherTotal:other,subtotal,tax,paymentFee,grandTotal:total}))document.getElementById(id).textContent=yen(v);return{h,drink,cast,original,other,subtotal,tax,paymentFee,total,payment}}
hours.addEventListener('change',calculate);document.getElementById('payment').addEventListener('change',calculate);document.getElementById('originalCount').addEventListener('input',calculate);document.querySelectorAll('.cast-count').forEach(e=>e.addEventListener('input',calculate));items.addEventListener('input',calculate);items.addEventListener('click',e=>{const button=e.target.closest('[data-remove-row]');if(button){button.closest('.line-item').remove();calculate()}});document.getElementById('addItem').addEventListener('click',()=>addItem());document.getElementById('reset').addEventListener('click',()=>{hours.value='1';document.getElementById('payment').value='cash';document.getElementById('originalCount').value='0';document.querySelectorAll('.cast-count').forEach(e=>e.value='0');items.innerHTML='';for(let i=0;i<8;i++)addItem();status.textContent='リセットしました。'});document.getElementById('copy').addEventListener('click',async()=>{const c=calculate();const extras=[...items.querySelectorAll('.line-item')].map(r=>{const name=r.children[0].value.trim()||'その他',amount=Math.max(0,Number(r.children[1].value)||0);return amount?`${name}: ${yen(amount)}`:''}).filter(Boolean);const casts=[...document.querySelectorAll('.cast-count')].filter(e=>Math.max(0,Math.floor(Number(e.value)||0))>0).map(e=>`${e.getAttribute('aria-label').replace('の杯数','')} ${Math.max(0,Math.floor(Number(e.value)||0))}杯`);const bottles=Math.max(0,Math.floor(Number(document.getElementById('originalCount').value)||0));const names={cash:'現金',card:'カード',paypay:'PayPay'};const detail=['【まむバースデー お会計明細】',`飲み放題（${c.h}時間）: ${yen(c.drink)}`,`キャスドリ（${casts.join('、')||'なし'}）: ${yen(c.cast)}`,`まむオリシャン（${bottles}本）: ${yen(c.original)}`,...extras,`小計: ${yen(c.subtotal)}`,`TAX（10%）: ${yen(c.tax)}`,`支払い方法: ${names[c.payment]}`,`カード・PayPay追加分: ${yen(c.paymentFee)}`,`お支払い合計: ${yen(c.total)}`].join('\n');try{await navigator.clipboard.writeText(detail);status.textContent='明細をコピーしました。'}catch(e){status.textContent=detail+'\n（自動コピーできない場合は、この明細を選択してコピーしてください）'}});calculate();
</script></body></html>
